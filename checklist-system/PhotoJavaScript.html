<script>
(function () {
  var MAX_SIDE = 1600;   // longest side after shrinking, in pixels
  var QUALITY = 0.8;     // JPEG quality; about 300-500 KB per photo
  var lastError = '';

  function $(id) { return document.getElementById(id); }

  function init() {
    $('day').textContent = PAGE.dayLabel;
    if (!PAGE.checklists.length) {
      $('none').classList.remove('hidden');
      return;
    }
    PAGE.checklists.forEach(function (c) {
      var o = document.createElement('option');
      o.value = c.id;
      o.textContent = c.name;
      $('checklist').appendChild(o);
    });
    if (PAGE.preselect) $('checklist').value = PAGE.preselect;
    if (!$('checklist').value) $('checklist').selectedIndex = 0;
    $('checklist').addEventListener('change', showPositions);
    showPositions();
    try { $('leader').value = localStorage.getItem('checklistLeader') || ''; } catch (e) {}
    $('files').addEventListener('change', function () {
      var n = $('files').files.length;
      $('picked').textContent = n ? n + (n === 1 ? ' photo' : ' photos') + ' selected' : '';
    });
    $('form').addEventListener('submit', start);
    $('form').classList.remove('hidden');
  }

  function current() {
    var id = $('checklist').value;
    return PAGE.checklists.filter(function (c) { return c.id === id; })[0];
  }

  function showPositions() {
    var c = current();
    var sel = $('position');
    sel.innerHTML = '';
    if (!c || !c.positions.length) {
      $('posWrap').classList.add('hidden');
      return;
    }
    var blank = document.createElement('option');
    blank.value = '';
    blank.textContent = 'Pick your position';
    sel.appendChild(blank);
    c.positions.forEach(function (p) {
      var o = document.createElement('option');
      o.value = p;
      o.textContent = p;
      sel.appendChild(o);
    });
    $('posWrap').classList.remove('hidden');
  }

  function start(ev) {
    ev.preventDefault();
    var c = current();
    var files = Array.prototype.slice.call($('files').files);
    var job = { key: PAGE.key, checklistId: c.id, position: $('position').value, leader: $('leader').value.trim() };
    if (c.positions.length && !job.position) return say('Pick your position.', true);
    if (!job.leader) return say('Enter your name.', true);
    if (!files.length) return say('Choose at least one photo.', true);
    try { localStorage.setItem('checklistLeader', job.leader); } catch (e) {}

    $('send').disabled = true;  // no double uploads
    lastError = '';
    var done = 0;
    var failed = 0;
    (function next(i) {
      if (i >= files.length) return finish(done, failed);
      say('Uploading ' + (i + 1) + ' of ' + files.length + '...');
      shrink(files[i], function (data) {
        if (!data) {
          failed++;
          return next(i + 1);
        }
        send(job, i + 1, data, 2, function (ok) {
          if (ok) done++; else failed++;
          next(i + 1);
        });
      });
    })(0);
  }

  // One photo per server call, with one retry
  function send(job, index, data, tries, cb) {
    google.script.run
      .withSuccessHandler(function () { cb(true); })
      .withFailureHandler(function (err) {
        if (tries > 1) return send(job, index, data, tries - 1, cb);
        lastError = (err && err.message) || '';
        cb(false);
      })
      .serverUploadPhoto({ key: job.key, checklistId: job.checklistId, position: job.position, leader: job.leader, index: index, data: data });
  }

  // Shrinks the photo on the phone so it uploads fast and saves Drive space
  function shrink(file, cb) {
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () {
      var scale = Math.min(1, MAX_SIDE / Math.max(img.width, img.height));
      var canvas = document.createElement('canvas');
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(url);
      cb(canvas.toDataURL('image/jpeg', QUALITY).split(',')[1]);
    };
    img.onerror = function () {
      URL.revokeObjectURL(url);
      cb(null);
    };
    img.src = url;
  }

  function finish(done, failed) {
    $('send').disabled = false;
    $('files').value = '';
    $('picked').textContent = '';
    if (failed) say(done + ' uploaded, ' + failed + ' failed. ' + (lastError || 'Choose the failed ones and try again.'), true);
    else say(done + (done === 1 ? ' photo' : ' photos') + ' uploaded. Thank you!');
  }

  function say(msg, bad) {
    $('status').textContent = msg;
    $('status').className = bad ? 'bad' : 'good';
  }

  init();
})();
</script>
