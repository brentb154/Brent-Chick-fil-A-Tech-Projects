<style>
  body { margin: 0; padding: 4px 6px; font-family: Arial, sans-serif; font-size: 14px; color: #222; background: #fff; }
  label, .label { display: block; margin: 12px 0 4px; font-weight: bold; }
  select, input, textarea { box-sizing: border-box; width: 100%; padding: 7px 8px; font: inherit; border: 1px solid #ccc; border-radius: 6px; background: #fff; }
  textarea { resize: vertical; }
  .days { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
  .boxes { display: inline-flex; flex-wrap: wrap; gap: 6px 16px; }
  .day { display: inline-flex; align-items: center; gap: 4px; margin: 0; font-weight: normal; cursor: pointer; }
  .day.off { color: #aaa; cursor: default; }
  .day input, .check input { width: auto; margin: 0; }
  .check { display: flex; align-items: center; gap: 6px; font-weight: normal; }
  .small { font-size: 12px; font-weight: normal; color: #777; }
  button { padding: 7px 14px; font: inherit; border: 1px solid #ccc; border-radius: 6px; background: #fff; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: default; }
  .primary { color: #fff; background: #1a73e8; border-color: #1a73e8; font-weight: bold; }
  .actions { display: flex; gap: 8px; margin-top: 18px; }
  #status { min-height: 1.4em; margin: 12px 0 0; line-height: 1.4; }
  #status.good { color: #1e7e34; }
  #status.bad { color: #b3261e; font-weight: bold; }
  .modes { display: flex; margin-bottom: 4px; }
  .mode { border-radius: 0; }
  .mode:first-child { border-radius: 6px 0 0 6px; }
  .mode:last-child { border-left: 0; border-radius: 0 6px 6px 0; }
  .mode.on { color: #fff; background: #1a73e8; border-color: #1a73e8; font-weight: bold; }
  .hidden { display: none !important; }
</style>
