<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <base target="_top">
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background: #f6f6f6; color: #222; }
      main { max-width: 480px; margin: 0 auto; padding: 24px 16px 40px; }
      h1 { font-size: 26px; margin: 0 0 4px; }
      .sub { color: #666; margin: 0 0 20px; }
      label { display: block; font-weight: 600; margin: 0 0 16px; }
      input { display: block; width: 100%; margin-top: 6px; padding: 12px; font-size: 17px; border: 1px solid #ccc; border-radius: 8px; background: #fff; color: #222; }
      .go { display: block; padding: 18px; font-size: 20px; font-weight: 700; text-align: center; color: #fff; background: #e51636; border-radius: 10px; text-decoration: none; }
      .code { margin-top: 18px; color: #666; font-size: 15px; }
      .code b { color: #222; letter-spacing: 2px; }
    </style>
  </head>
  <body>
    <main>
      <h1 id="station"></h1>
      <p class="sub" id="list"></p>
      <label>Your name
        <input id="name" autocomplete="name" maxlength="60">
      </label>
      <a id="go" class="go" href="#">Open checklist</a>
      <p class="code">Station code: <b id="code"></b> <span id="typeIt"></span></p>
    </main>
    <script>var PAGE = <?!= data ?>;</script>
    <script>
    // Opens today's form with this station, its code and the person's name filled in. Once the
    // name is saved on this phone, the page goes straight to the form.
    (function () {
      var p = PAGE.prefill;
      function $(id) { return document.getElementById(id); }

      function name() {
        return $('name').value.replace(/\s+/g, ' ').trim();
      }

      function link() {
        if (!p) return PAGE.formLink;
        var q = ['usp=pp_url', p.position + '=' + encodeURIComponent(PAGE.station), p.code + '=' + encodeURIComponent(PAGE.code)];
        if (name()) q.push(p.leader + '=' + encodeURIComponent(name()));
        return p.base + '?' + q.join('&');
      }

      $('station').textContent = PAGE.station;
      $('list').textContent = PAGE.checklist;
      $('code').textContent = PAGE.code;
      $('typeIt').textContent = p ? '' : '(type this into the form)';
      var saved = '';
      try { saved = localStorage.getItem('checklistLeader') || ''; } catch (e) {}
      $('name').value = saved;
      $('go').href = link();
      $('name').addEventListener('input', function () { $('go').href = link(); });
      $('go').addEventListener('click', function () {
        try { if (name()) localStorage.setItem('checklistLeader', name()); } catch (e) {}
      });
      // If the browser blocks this, the button is still there
      if (saved) {
        try { window.top.location.href = link(); } catch (e) {}
      }
    })();
    </script>
  </body>
</html>
