<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background: #f6f6f6; color: #222; }
  main { max-width: 480px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  .sub { color: #666; margin: 0 0 16px; }
  label { display: block; font-weight: 600; margin: 0 0 14px; }
  select, #leader { display: block; width: 100%; margin-top: 6px; padding: 12px; font-size: 17px; border: 1px solid #ccc; border-radius: 8px; background: #fff; color: #222; }
  .note { margin: -4px 0 14px; padding: 10px 12px; font-size: 15px; color: #7a5600; background: #fff3cd; border-radius: 8px; }
  .pick { position: relative; margin-bottom: 6px; text-align: center; padding: 20px; border: 2px dashed #e51636; border-radius: 10px; color: #e51636; background: #fff; }
  .pick input { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; }
  .pick.off { border-color: #bbb; color: #999; }
  #tray { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; margin: 0 0 14px; }
  #tray:empty { display: none; }
  .tile { position: relative; aspect-ratio: 1 / 1; overflow: hidden; border-radius: 8px; background: #e2e2e2; }
  .tile img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .tile img:not([src]) { visibility: hidden; }
  .tile.new::after, .tile.shrinking::after { content: '\2026'; position: absolute; top: 50%; left: 0; right: 0; margin-top: -12px; text-align: center; font-size: 20px; color: #888; }
  .tile.uploading img, .tile.waiting img { opacity: 0.55; }
  .tile .x { position: absolute; top: 4px; right: 4px; width: 32px; height: 32px; padding: 0; font-size: 22px; line-height: 32px; border-radius: 50%; background: rgba(0, 0, 0, 0.6); }
  .tile .badge { position: absolute; left: 4px; bottom: 4px; min-width: 24px; height: 24px; padding: 0 6px; font-size: 15px; font-weight: 700; line-height: 24px; text-align: center; color: #fff; border-radius: 12px; }
  .tile .badge:empty { display: none; }
  .tile.done .badge { background: #1e7e34; }
  .tile.failed .badge, .tile.unreadable .badge { background: #b3261e; }
  #progress { height: 10px; margin-top: 4px; overflow: hidden; border-radius: 5px; background: #e2e2e2; }
  #bar { width: 0; height: 100%; background: #e51636; transition: width 0.3s; }
  #status { margin-top: 14px; font-size: 17px; }
  button { width: 100%; padding: 16px; font-size: 18px; font-weight: 700; color: #fff; background: #e51636; border: 0; border-radius: 10px; }
  button:disabled { background: #c9c9c9; }
  #hint { margin-top: 8px; }
  .good { color: #1e7e34; font-weight: 600; }
  .bad { color: #b3261e; }
  .hidden { display: none !important; }
</style>
