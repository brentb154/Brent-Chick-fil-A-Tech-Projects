<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <?!= include('AddItemStylesheet'); ?>
  </head>
  <body>
    <form id="form" autocomplete="off">
      <label for="checklist">Checklist</label>
      <select id="checklist"></select>

      <label for="section" id="sectionLabel">Position</label>
      <select id="section"></select>
      <input id="newSection" class="hidden" placeholder="Section name, e.g. Restroom">

      <label for="task">Task</label>
      <textarea id="task" rows="3" placeholder="Write it the way it should read on the form."></textarea>

      <span class="label">Days</span>
      <div class="days">
        <button type="button" id="everyDay">Every day</button>
        <span id="dayBoxes"></span>
      </div>

      <label class="check"><input type="checkbox" id="photo"> Needs a photo <span class="small" id="photoNote"></span></label>

      <label for="reference">Reference material <span class="small">(optional, shown under the task)</span></label>
      <input id="reference">

      <label for="after">Put it</label>
      <select id="after"></select>

      <div class="actions">
        <button type="button" id="add" class="primary">Add task</button>
        <button type="button" id="close">Close</button>
      </div>
      <p id="status"></p>
    </form>
    <script>var PAGE = <?!= data ?>;</script>
    <?!= include('AddItemJavaScript'); ?>
  </body>
</html>
