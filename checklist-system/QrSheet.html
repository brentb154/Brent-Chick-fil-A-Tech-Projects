<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <base target="_top">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
      body { margin: 0; font-family: Arial, sans-serif; color: #111; background: #fff; }
      .bar { display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-bottom: 1px solid #ddd; }
      .bar button { padding: 10px 20px; font-size: 16px; font-weight: bold; color: #fff; background: #e51636; border: 0; border-radius: 8px; cursor: pointer; }
      #problem { margin: 16px; color: #b3261e; font-weight: bold; }
      .card { box-sizing: border-box; display: flex; align-items: center; gap: 0.35in; width: 7.5in; height: 4.9in; margin: 0.15in auto; padding: 0.3in; border: 2px dashed #bbb; border-radius: 12px; break-inside: avoid; page-break-inside: avoid; }
      .qr { flex: none; width: 3.6in; height: 3.6in; }
      .qr img, .qr canvas { width: 100% !important; height: 100% !important; }
      .card h2 { margin: 0 0 12px; font-size: 30px; }
      .card p { margin: 0 0 8px; font-size: 18px; color: #444; }
      .card:nth-of-type(2n) { break-after: page; page-break-after: always; }
      @media print { .bar { display: none; } .card { margin: 0.2in auto; } }
    </style>
  </head>
  <body>
    <div class="bar"><button id="print" type="button">Print</button><span id="title"></span></div>
    <p id="problem" hidden></p>
    <div id="cards"></div>
    <script>var PAGE = <?!= data ?>;</script>
    <script>
    // One card per station, two per printed page, sized to laminate
    (function () {
      function $(id) { return document.getElementById(id); }
      $('title').textContent = PAGE.checklist + ' \u2013 ' + PAGE.stations.length + ' stations';
      $('print').addEventListener('click', function () { window.print(); });
      if (!window.QRCode) {
        $('problem').hidden = false;
        $('problem').textContent = 'The QR code maker didn\'t load. Check the internet connection and reload this page.';
        return;
      }
      PAGE.stations.forEach(function (s) {
        var card = document.createElement('div');
        card.className = 'card';
        var qr = document.createElement('div');
        qr.className = 'qr';
        var text = document.createElement('div');
        var h = document.createElement('h2');
        h.textContent = s.name;
        var p1 = document.createElement('p');
        p1.textContent = 'Scan on your walk to check off this station.';
        var p2 = document.createElement('p');
        p2.textContent = PAGE.checklist;
        text.appendChild(h);
        text.appendChild(p1);
        text.appendChild(p2);
        card.appendChild(qr);
        card.appendChild(text);
        $('cards').appendChild(card);
        new QRCode(qr, { text: s.url, width: 720, height: 720, correctLevel: QRCode.CorrectLevel.M });
      });
    })();
    </script>
  </body>
</html>
